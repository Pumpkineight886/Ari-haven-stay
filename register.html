<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Haven Stay Hotel | Register</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link rel="stylesheet" href="style2.css">
    </head>

    <body>

        <header>
            <div class="container navbar">

                <a href="index.html" class="logo">
                    Haven<span>Stay</span>
                </a>
                <button class="menu-toggle" id="menu-toggle">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <nav class="nav-links">
                    <div class="nav-center">
                        <a href="index.html">Home</a>
                        <a href="rooms.html">Rooms</a>
                        <a href="about.html">About</a>
                    </div>

                    <!-- Visible before login -->
                    <div id="guest-links" class="nav-group">
                        <a href="login.html">Login</a>
                        <a href="register.html">Register</a>
                    </div>

                    <!-- Visible after login -->
                    <div id="user-links" class="nav-group hidden">
                        <span id="welcome-user" class="welcome-user">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <a href="cart.html" class="cart-link">
                        Cart 
                        <span id="cart-count">0</span>
                        </a>

                        <a href="#" id="logout-btn">Logout</a>
                    </div>
                </nav>

            </div>
        </header>


        <section class="section">

            <div class="container">

                <div class="section-title">
                    <h2>Create Your Account</h2>
                    <p>
                        Join Haven Stay and start booking your perfect stay.
                    </p>
                </div>


                <form class="contact-form auth-form" id="register-form">


                    <div class="form-group">

                        <label for="register-name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="register-name"
                            placeholder="Enter your full name"
                        >

                        <span class="form-error" id="register-name-error">
                            Please enter your name.
                        </span>

                    </div>



                    <div class="form-group">

                        <label for="register-email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="register-email"
                            placeholder="Enter your email"
                        >

                        <span class="form-error" id="register-email-error">
                            Please enter a valid email.
                        </span>

                    </div>



                    <div class="form-group">

                        <label for="register-password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="register-password"
                            placeholder="Create a password"
                        >

                        <span class="form-error" id="register-password-error">
                            Password must be at least 6 characters.
                        </span>

                    </div>



                    <div class="form-group">

                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            placeholder="Confirm password"
                        >

                        <span class="form-error" id="confirm-password-error">
                            Passwords do not match.
                        </span>

                    </div>



                    <button class="btn auth-btn" type="submit">
                        Create Account
                    </button>



                    <p class="auth-switch">

                        Already have an account?

                        <a href="login.html" class="auth-link">
                            Login
                        </a>

                    </p>


                </form>

            </div>

        </section>
        <div id="toast"></div>


        <script src="script.js"></script>
        <script src="auth(LR).js"></script>

    </body>
</html>
